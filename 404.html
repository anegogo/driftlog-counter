<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page not found — Driftlog Counter</title>
<meta name="robots" content="noindex" />
<meta name="description" content="That page doesn't exist on counter.getdriftlog.com." />
<link rel="icon" type="image/png" href="/img/icon-64.png" />
<link rel="stylesheet" href="/fonts.css" />
<style>
  :root{
    --serif:"Fraunces","Georgia",serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    --cream:#FCF7F0; --ink:#322014; --muted:#7A6555; --accent:#D6692E;
    --line:#EAD9C9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--cream); color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px; line-height:1.7;
  }
  .wrap{max-width:560px; text-align:center}
  .tag{
    font-size:12px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--accent); font-weight:600; margin-bottom:18px;
  }
  h1{font-family:var(--serif); font-size:clamp(30px,6vw,44px); line-height:1.15; margin-bottom:18px}
  p{color:var(--muted); font-size:16px; margin-bottom:28px}
  nav{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  nav a{
    display:inline-block; padding:10px 18px; border:1px solid var(--line);
    border-radius:999px; text-decoration:none; color:var(--ink); font-size:14px;
    background:#FFFDFB;
  }
  nav a:hover{border-color:var(--accent); color:var(--accent)}
  nav a.primary{background:var(--accent); border-color:var(--accent); color:#fff}
</style>
</head>
<body>
  <main class="wrap">
    <p class="tag">404</p>
    <h1>This page isn't on the map.</h1>
    <p>The address you followed doesn't exist here. Here's everything that does.</p>
    <nav>
      <a class="primary" href="/">Count your countries</a>
      <a href="/passport/">Passport page</a>
      <a href="/tools/timeline-json-reader/">Timeline.json Reader</a>
      <a href="/ja/" hreflang="ja">都道府県を数える</a>
      <a href="https://getdriftlog.com/">The Driftlog app</a>
    </nav>
  </main>
</body>
</html>
